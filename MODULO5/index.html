<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div id="app">
      <h1>Juego 7 y media</h1>
      <img
        src="https://github.com/Lemoncode/fotos-ejemplos/blob/main/cartas/back.jpg?raw=true"
        alt="carta mostrada"
        id="carta-mostrada"
      />
      <div class="botonera">
        <button id="pedir-carta">Pedir carta</button>
        <button id="plantarse">Plantarse</button>
        <button id="reiniciar" style="display: none">Nueva partida</button>
      </div>

      <div class="puntuacion">
        <p class="puntos">Puntos: <span id="puntos-num">0</span></p>
        <p class="game-over" style="display: none">Has perdido</p>
        <p class="win" style="display: none">Has ganado</p>
        <p class="mensajePlantar"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
